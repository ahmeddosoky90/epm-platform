name: Deploy
# Ships main to Render: migrate Supabase → make sure the file bucket exists → sync Render settings → deploy and wait.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
permissions: { contents: read }
env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  STORAGE_S3_ACCESS_KEY: ${{ secrets.STORAGE_S3_ACCESS_KEY }}
  STORAGE_S3_SECRET_KEY: ${{ secrets.STORAGE_S3_SECRET_KEY }}
  BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
  MAIL_FROM: ${{ secrets.MAIL_FROM }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: Apply database migrations
        run: DATABASE_URL="$SUPABASE_DB_URL" npx prisma migrate deploy
      - name: Ensure file bucket
        run: node scripts/ensure-bucket.mjs
      - name: Sync Render service and settings
        id: sync
        run: node scripts/render.mjs sync
      - name: Deploy this commit
        run: node scripts/render.mjs deploy "$GITHUB_SHA"
      - name: First administrator (only when the database has no users)
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          APP_URL: ${{ steps.sync.outputs.app_url }}
        run: |
          if [ -z "$ADMIN_EMAIL" ]; then echo "ADMIN_EMAIL secret not set; skipping."; exit 0; fi
          DATABASE_URL="$SUPABASE_DB_URL" ONLY_IF_NO_USERS=true npx tsx prisma/create-admin.ts
      - name: Summary
        run: echo "Live at ${{ steps.sync.outputs.app_url }}" >> "$GITHUB_STEP_SUMMARY"
