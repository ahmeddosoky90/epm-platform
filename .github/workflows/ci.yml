name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: epm, POSTGRES_USER: epm, POSTGRES_PASSWORD: epm-ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U epm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://epm:epm-ci@localhost:5432/epm?schema=public
      APP_ENCRYPTION_KEY: ci-only-encryption-key-not-a-secret-000000
      DEMO_PASSWORD: Ci-Demo-Password-123
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate and seed the test database
        run: npx prisma migrate deploy && npm run db:seed
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
